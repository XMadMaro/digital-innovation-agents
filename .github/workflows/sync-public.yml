name: Sync to public mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Strip internal files
        run: |
          # Save public workflows before removing .github
          cp .github/workflows/deploy-docs.yml /tmp/deploy-docs.yml 2>/dev/null || true

          # Internal directories that must not appear in the public repo
          for dir in _devprocess .github scripts; do
            git rm -rf --cached "$dir" 2>/dev/null || true
            rm -rf "$dir"
          done

          # Restore public workflows
          mkdir -p .github/workflows
          cp /tmp/deploy-docs.yml .github/workflows/deploy-docs.yml 2>/dev/null || true
          git add .github/workflows/ 2>/dev/null || true

          # Internal top-level files
          git rm -f --cached CLAUDE.md 2>/dev/null || true
          rm -f CLAUDE.md

      - name: Commit filtered state
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if ! git diff --cached --quiet; then
            git commit -m "chore: strip internal files for public mirror [skip ci]"
          fi

      - name: Push to public mirror
        env:
          TOKEN: ${{ secrets.DIA_PUBLIC_TOKEN }}
        run: |
          git remote add public "https://x-access-token:${TOKEN}@github.com/pssah4/digital-innovation-agents.git"
          git push public HEAD:main --force
